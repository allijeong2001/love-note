<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>设置</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="float-deco" id="floatDeco"></div>

<div class="page">
  <header class="topbar">
    <a class="back-btn" href="index.html" aria-label="返回主页">←</a>
    <span class="topbar-title" id="pageTitle">设置</span>
  </header>

  <div class="set-wrap">

    <!-- 朋友圈 -->
    <div class="set-card">
      <h2>🐤 朋友圈频率</h2>
      <div class="set-row2">
        <div class="set-field">
          <label>每天最少发几条</label>
          <div class="stepper">
            <button class="st-btn" data-minus="momentPerDayMin" type="button">−</button>
            <input type="number" id="momentPerDayMin" min="0" max="20">
            <button class="st-btn" data-plus="momentPerDayMin" type="button">+</button>
          </div>
        </div>
        <div class="set-field">
          <label>每天最多发几条</label>
          <div class="stepper">
            <button class="st-btn" data-minus="momentPerDayMax" type="button">−</button>
            <input type="number" id="momentPerDayMax" min="1" max="20">
            <button class="st-btn" data-plus="momentPerDayMax" type="button">+</button>
          </div>
        </div>
      </div>
      <div class="set-row2">
        <div class="set-field">
          <label>活跃开始时间（时）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="momentFromHour" type="button">−</button>
            <input type="number" id="momentFromHour" min="0" max="23">
            <button class="st-btn" data-plus="momentFromHour" type="button">+</button>
          </div>
        </div>
        <div class="set-field">
          <label>活跃结束时间（时）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="momentToHour" type="button">−</button>
            <input type="number" id="momentToHour" min="0" max="23">
            <button class="st-btn" data-plus="momentToHour" type="button">+</button>
          </div>
        </div>
      </div>
      <div class="set-row2">
        <div class="set-field" style="margin-bottom:0">
          <label>评论回复延迟 · 最短（秒）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="momentCommentDelayMin" type="button">−</button>
            <input type="number" id="momentCommentDelayMin" min="0" max="600">
            <button class="st-btn" data-plus="momentCommentDelayMin" type="button">+</button>
          </div>
        </div>
        <div class="set-field" style="margin-bottom:0">
          <label>评论回复延迟 · 最长（秒）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="momentCommentDelayMax" type="button">−</button>
            <input type="number" id="momentCommentDelayMax" min="1" max="600">
            <button class="st-btn" data-plus="momentCommentDelayMax" type="button">+</button>
          </div>
        </div>
      </div>
      <div class="tip">时间全部按<b>北京时间</b>计算。改完保存，下一次打开朋友圈就按新频率来。</div>
    </div>

    <!-- 写信 -->
    <div class="set-card">
      <h2>✉️ 写信频率</h2>
      <div class="set-row2">
        <div class="set-field">
          <label>回信延迟 · 最短（分钟）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="letterReplyMinMin" type="button">−</button>
            <input type="number" id="letterReplyMinMin" min="1" max="600">
            <button class="st-btn" data-plus="letterReplyMinMin" type="button">+</button>
          </div>
        </div>
        <div class="set-field">
          <label>回信延迟 · 最长（分钟）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="letterReplyMaxMin" type="button">−</button>
            <input type="number" id="letterReplyMaxMin" min="1" max="600">
            <button class="st-btn" data-plus="letterReplyMaxMin" type="button">+</button>
          </div>
        </div>
      </div>
      <div class="set-field">
        <label>他每天主动写几封信给我</label>
        <div class="stepper" style="max-width:170px">
          <button class="st-btn" data-minus="letterActivePerDay" type="button">−</button>
          <input type="number" id="letterActivePerDay" min="1" max="20">
          <button class="st-btn" data-plus="letterActivePerDay" type="button">+</button>
        </div>
      </div>
      <div class="set-row2">
        <div class="set-field" style="margin-bottom:0">
          <label>主动写信 · 最早（时）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="letterActiveFromHour" type="button">−</button>
            <input type="number" id="letterActiveFromHour" min="0" max="23">
            <button class="st-btn" data-plus="letterActiveFromHour" type="button">+</button>
          </div>
        </div>
        <div class="set-field" style="margin-bottom:0">
          <label>主动写信 · 最晚（时）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="letterActiveToHour" type="button">−</button>
            <input type="number" id="letterActiveToHour" min="0" max="23">
            <button class="st-btn" data-plus="letterActiveToHour" type="button">+</button>
          </div>
        </div>
      </div>
      <div class="tip">他每天都一定会主动给你写信，封数在上面改。时间全部按<b>北京时间</b>算。</div>
    </div>

    <!-- 聊天 -->
    <div class="set-card">
      <h2>💬 聊天</h2>
      <div class="set-field">
        <label>他多久才回我（秒）</label>
        <input type="number" id="chatReplyDelaySec" class="set-input" min="1" step="1"
               inputmode="numeric" placeholder="比如 3">
        <div class="tip" style="margin-top:8px">
          填 1 就是秒回；想让他慢一点就填大一点，比如 300 就是 5 分钟后才回。
          等他的这段时间里，聊天框会一直显示「…」。
        </div>
      </div>
    </div>

    <!-- 学习 -->
    <div class="set-card">
      <h2>⏱ 陪伴学习</h2>
      <div class="set-row2">
        <div class="set-field" style="margin-bottom:0">
          <label>默认专注（分钟）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="focusMinutes" type="button">−</button>
            <input type="number" id="focusMinutes" min="1" max="300">
            <button class="st-btn" data-plus="focusMinutes" type="button">+</button>
          </div>
        </div>
        <div class="set-field" style="margin-bottom:0">
          <label>默认休息（分钟）</label>
          <div class="stepper">
            <button class="st-btn" data-minus="breakMinutes" type="button">−</button>
            <input type="number" id="breakMinutes" min="1" max="120">
            <button class="st-btn" data-plus="breakMinutes" type="button">+</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 数据 -->
    <div class="set-card">
      <h2>💾 我的数据</h2>
      <div class="tip" style="margin-bottom:10px">
        字卡、聊天记录、朋友圈、信件全都存在这台手机里，不会上传到任何地方。
        换手机前可以先导出备份。
      </div>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn ghost small" id="exportBtn" type="button">导出备份</button>
        <button class="btn ghost small" id="importBtn" type="button">导入备份</button>
        <button class="btn ghost small" id="copyBtn" type="button">复制</button>
      </div>
      <div class="field mt12" id="backupField" style="display:none">
        <textarea id="backupBox" rows="6" spellcheck="false"></textarea>
      </div>
      <div class="row mt12" style="gap:8px;flex-wrap:wrap">
        <button class="btn ghost small" id="clearChat" type="button">清空聊天记录</button>
        <button class="btn ghost small" id="clearMoments" type="button">清空朋友圈</button>
        <button class="btn ghost small" id="clearLetters" type="button">清空信匣</button>
      </div>
      <div class="set-status" id="status"></div>
    </div>

    <div class="row" style="gap:10px;margin-bottom:10px">
      <button class="btn" id="saveBtn" type="button" style="flex:1">保存设置</button>
      <button class="btn ghost" id="resetBtn" type="button">恢复默认</button>
    </div>

  </div>
</div>

<script src="config.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script src="player.js"></script>
<script src="js/cards.js"></script>
<script>
(function () {
  LN.boot({ title: '设置' });

  var STEPS = {
    momentPerDayMin: 1, momentPerDayMax: 1,
    momentFromHour: 1, momentToHour: 1,
    momentCommentDelayMin: 10, momentCommentDelayMax: 10,
    letterReplyMinMin: 5, letterReplyMaxMin: 5,
    letterActivePerDay: 1,
    letterActiveFromHour: 1, letterActiveToHour: 1,
    focusMinutes: 5, breakMinutes: 1
  };
  var NUMBERS = Object.keys(STEPS);

  var st = LN.getSettings();
  var status = document.getElementById('status');

  function setStatus(text, ok) {
    status.textContent = text || '';
    status.className = 'set-status' + (ok ? ' ok' : '');
  }

  function fill() {
    NUMBERS.forEach(function (k) { document.getElementById(k).value = st[k]; });
    document.getElementById('chatReplyDelaySec').value = st.chatReplyDelaySec;
  }

  function bump(key, delta) {
    var el = document.getElementById(key);
    var v = (Number(el.value) || 0) + delta * STEPS[key];
    var min = Number(el.getAttribute('min')), max = Number(el.getAttribute('max'));
    v = Math.max(min, Math.min(max, v));
    el.value = v;
    st[key] = v;
    fixRanges();
  }
  function fixRanges() {
    ['momentPerDay', 'momentCommentDelay', 'letterReply'].forEach(function (pre) {
      var a = document.getElementById(pre + (pre === 'momentPerDay' ? 'Min' : 'Min'));
      var b = document.getElementById(pre + (pre === 'momentPerDay' ? 'Max' : 'Max'));
      if (!a || !b) return;
      if (Number(b.value) < Number(a.value)) b.value = a.value;
    });
    var fh = document.getElementById('momentFromHour'), th = document.getElementById('momentToHour');
    if (Number(th.value) < Number(fh.value)) th.value = fh.value;
  }

  LN.$$('[data-minus]').forEach(function (b) {
    b.addEventListener('click', function () { bump(b.getAttribute('data-minus'), -1); });
  });
  LN.$$('[data-plus]').forEach(function (b) {
    b.addEventListener('click', function () { bump(b.getAttribute('data-plus'), 1); });
  });
  document.getElementById('saveBtn').addEventListener('click', function () {
    var patch = {};
    NUMBERS.forEach(function (k) { patch[k] = Number(document.getElementById(k).value); });
    var sec = Number(document.getElementById('chatReplyDelaySec').value);
    patch.chatReplyDelaySec = (isFinite(sec) && sec >= 1) ? Math.floor(sec) : 1;
    /* 每天最少不能大于最多 */
    if (patch.momentPerDayMin > patch.momentPerDayMax) patch.momentPerDayMax = patch.momentPerDayMin;
    if (patch.letterReplyMinMin > patch.letterReplyMaxMin) patch.letterReplyMaxMin = patch.letterReplyMinMin;
    if (patch.momentFromHour > patch.momentToHour) patch.momentToHour = patch.momentFromHour;
    st = LN.setSettings(patch);
    fill();
    setStatus('已保存 ✓ 频率设置下次打开对应页面就生效。', true);
  });

  document.getElementById('resetBtn').addEventListener('click', function () {
    /* 用自己画的确认框，内嵌预览和 APP 里都点得动 */
    LN.ask('把所有频率恢复成默认？', function (ok) {
      if (!ok) return;
      st = LN.resetSettings();
      fill();
      setStatus('已恢复默认 ✓', true);
    });
  });

  /* ---------------- 备份 ---------------- */
  var backupBox = document.getElementById('backupBox');
  var backupField = document.getElementById('backupField');

  document.getElementById('exportBtn').addEventListener('click', function () {
    var data = {};
    Object.keys(LN.KEYS).forEach(function (k) {
      var v = LN.read(LN.KEYS[k], null);
      if (v !== null) data[LN.KEYS[k]] = v;
    });
    backupBox.value = JSON.stringify(data);
    backupField.style.display = 'block';
    setStatus('已生成备份，长按全选复制保存起来即可。');
  });
  document.getElementById('copyBtn').addEventListener('click', function () {
    if (!backupBox.value) { setStatus('先点「导出备份」生成内容。'); return; }
    backupBox.select();
    try { document.execCommand('copy'); setStatus('已复制到剪贴板 ✓', true); }
    catch (e) { setStatus('复制失败，请手动长按选择复制。'); }
  });
  document.getElementById('importBtn').addEventListener('click', function () {
    if (!backupBox.value.trim()) {
      backupField.style.display = 'block';
      setStatus('把之前导出的内容粘进下面的框里，再点一次「导入备份」。');
      backupBox.focus();
      return;
    }
    try {
      var data = JSON.parse(backupBox.value);
      Object.keys(data).forEach(function (k) { LN.write(k, data[k]); });
      st = LN.getSettings();
      fill();
      setStatus('导入成功 ✓ 字卡、聊天记录、朋友圈、信件都回来了。', true);
    } catch (e) {
      setStatus('导入失败：内容不是有效的备份文字。');
    }
  });

  /* ---------------- 清空 ---------------- */
  function clearKey(key, name) {
    LN.ask('清空' + name + '？这一步不能撤销。', function (ok) {
      if (!ok) return;
      LN.write(key, []);
      setStatus(name + '已清空。', true);
    });
  }
  document.getElementById('clearChat').addEventListener('click', function () { clearKey(LN.KEYS.chatLog, '聊天记录'); });
  document.getElementById('clearMoments').addEventListener('click', function () {
    LN.ask('清空朋友圈？这一步不能撤销。', function (ok) {
      if (!ok) return;
      LN.write(LN.KEYS.moments, []);
      LN.del(LN.KEYS.momentSchedule);
      setStatus('朋友圈已清空。', true);
    });
  });
  document.getElementById('clearLetters').addEventListener('click', function () {
    LN.ask('清空信匣？这一步不能撤销。', function (ok) {
      if (!ok) return;
      LN.write(LN.KEYS.letters, []);
      LN.write(LN.KEYS.letterPending, []);
      setStatus('信匣已清空。', true);
    });
  });

  fill();
})();
</script>
</body>
</html>
