plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lovenote.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.lovenote.app'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        // 网页里的资源不需要压缩，避免 WebView 读取异常
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
